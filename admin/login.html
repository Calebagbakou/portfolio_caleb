<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Admin Caleb Creative</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-brand-mark">CA</span>
      <span class="login-brand-text">Caleb Creative<span>Administration</span></span>
    </div>
    <h1>Connexion</h1>
    <p>Accès réservé à l'administrateur du site.</p>

    <div class="form-error" id="formError"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="username">
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-full" id="loginBtn">Se connecter</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const errorBox = document.getElementById('formError');
  if (params.get('denied')){
    errorBox.textContent = "Ce compte n'a pas les droits d'administration.";
    errorBox.classList.add('show');
  }

  // Si déjà connecté ET admin, on saute directement le login.
  (async () => {
    const supabase = getSupabase();
    if (!supabase) return;
    const { data: { session } } = await supabase.auth.getSession();
    if (session){
      const { data } = await supabase.from('admins').select('id').eq('id', session.user.id).maybeSingle();
      if (data) window.location.href = 'index.html';
    }
  })();

  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const supabase = getSupabase();
    if (!supabase){
      errorBox.textContent = "Configuration Supabase manquante (vérifie assets/config.js).";
      errorBox.classList.add('show');
      return;
    }

    const btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Connexion...';
    errorBox.classList.remove('show');

    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error){
      errorBox.textContent = "Identifiants incorrects.";
      errorBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      return;
    }

    // Vérifie que ce compte est bien dans la table "admins"
    const { data: adminRow } = await supabase.from('admins').select('id').eq('id', data.user.id).maybeSingle();
    if (!adminRow){
      await supabase.auth.signOut();
      errorBox.textContent = "Ce compte n'a pas les droits d'administration.";
      errorBox.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Se connecter';
      return;
    }

    window.location.href = 'index.html';
  });
</script>
</body>
</html>
