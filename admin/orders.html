<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Commandes — Admin Caleb Creative</title>
<link rel="stylesheet" href="assets/admin.css">
<style>
  .order-card{ background:var(--surface-alt); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:12px; }
  .order-head{ display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-bottom:10px; }
  .order-ref{ font-family:'Poppins',monospace; font-size:12.5px; color:var(--ink-dim); }
  .order-total{ font-family:'Unbounded',sans-serif; font-weight:700; font-size:16px; }
  .order-customer{ font-size:13px; color:var(--ink-dim); margin-bottom:8px; }
  .order-items{ font-size:12.5px; color:var(--ink-dim); margin-bottom:10px; }
  .order-items div{ padding:3px 0; }
  .order-note{ font-size:12.5px; color:var(--ink-faint); font-style:italic; margin-bottom:10px; }
  .order-controls{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .order-controls select{ padding:8px 10px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:12.5px; }
  .order-date{ font-size:11.5px; color:var(--ink-faint); }
  .filter-tabs{ display:flex; gap:8px; flex-wrap:wrap; margin:16px 0 20px; }
  .filter-tabs button{ font-size:12.5px; font-weight:600; padding:8px 14px; border-radius:999px; border:1px solid var(--border-strong); background:transparent; color:var(--ink-dim); cursor:pointer; }
  .filter-tabs button.active{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
  .pill-status{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .pill-en_attente{ background:rgba(255,255,255,0.08); color:var(--ink-faint); }
  .pill-payee{ background:rgba(74,222,128,0.15); color:var(--success); }
  .pill-traitement{ background:rgba(204,255,0,0.15); color:var(--accent); }
  .pill-terminee{ background:rgba(74,222,128,0.15); color:var(--success); }
  .pill-annulee{ background:rgba(255,92,92,0.12); color:var(--danger); }
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-mobile-bar">
    <button class="admin-menu-btn" data-admin-menu-open aria-label="Ouvrir le menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand"><span class="brand-mark">CA</span>Admin</span>
  </div>
  <div class="admin-sidebar-backdrop"></div>
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <span class="admin-brand-mark">CA</span>
      <span class="admin-brand-text">Admin</span>
    </div>

    <nav class="admin-nav">
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>

      <div class="admin-nav-label">Portfolio</div>
      <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M3 13l5-4 4 3 5-5 4 3"/></svg>Projets</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>Services<span class="soon">bientôt</span></a>

      <div class="admin-nav-label">Médias</div>
      <a href="media.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>Bibliothèque média</a>

      <div class="admin-nav-label">Boutique</div>
      <a href="products.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 002 1.6h8.2a2 2 0 002-1.6L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>Produits</a>
      <a href="orders.html" class="active"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Commandes</a>

      <div class="admin-nav-label">Général</div>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1.3-4A8 8 0 1112 20a8 8 0 01-4-1z"/></svg>Messages<span class="soon">bientôt</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/></svg>Paramètres<span class="soon">bientôt</span></a>
    </nav>

    <button class="admin-logout" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Déconnexion
    </button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Commandes</h1>
      <span class="who" id="whoBox"></span>
    </div>

    <div class="panel">
      <div class="filter-tabs" id="filterTabs">
        <button data-filter="toutes" class="active">Toutes</button>
        <button data-filter="en_attente">En attente</button>
        <button data-filter="payee">Payées</button>
        <button data-filter="traitement">En traitement</button>
        <button data-filter="terminee">Terminées</button>
        <button data-filter="annulee">Annulées</button>
      </div>
      <p id="orderCountLabel">Chargement…</p>
      <div id="orderList"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ui.js"></script>
<script>
  let supabase;
  let ordersCache = [];
  let activeFilter = 'toutes';

  function escapeAdminHtml(v){
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function formatMoney(v){ return (Number(v)||0).toLocaleString('fr-FR') + ' FCFA'; }
  function formatDate(d){ return new Date(d).toLocaleString('fr-FR', { dateStyle:'medium', timeStyle:'short' }); }

  const STATUS_LABELS = { en_attente:'En attente', payee:'Payée', traitement:'En traitement', terminee:'Terminée', annulee:'Annulée' };
  const PAYMENT_LABELS = { non_confirme:'Non confirmé', confirme:'Confirmé' };

  function orderCardHTML(o){
    const c = o.customers || {};
    const items = (o.order_items || []).map(it =>
      `<div>${escapeAdminHtml(it.product_name)} (${escapeAdminHtml(it.plan_label)}) ×${it.qty} — ${formatMoney(it.line_total)}</div>`
    ).join('');

    return `
      <div class="order-card" data-id="${o.id}">
        <div class="order-head">
          <div>
            <span class="order-ref">${escapeAdminHtml(o.ref)}</span>
            <span class="pill-status pill-${o.status}" style="margin-left:8px;">${STATUS_LABELS[o.status] || o.status}</span>
          </div>
          <span class="order-total">${formatMoney(o.total)}</span>
        </div>
        <div class="order-customer">
          👤 ${escapeAdminHtml(c.name || '—')} · 📞 ${escapeAdminHtml(c.contact || '—')}${c.email ? ' · ✉️ ' + escapeAdminHtml(c.email) : ''}
        </div>
        <div class="order-items">${items || '<em>Aucun article</em>'}</div>
        ${o.note ? `<div class="order-note">Note : ${escapeAdminHtml(o.note)}</div>` : ''}
        <div class="order-controls">
          <select data-field="status">
            ${Object.entries(STATUS_LABELS).map(([v,l]) => `<option value="${v}" ${o.status===v?'selected':''}>${l}</option>`).join('')}
          </select>
          <select data-field="payment_status">
            ${Object.entries(PAYMENT_LABELS).map(([v,l]) => `<option value="${v}" ${o.payment_status===v?'selected':''}>Paiement : ${l}</option>`).join('')}
          </select>
          <span class="order-date">${formatDate(o.created_at)} · ${escapeAdminHtml(o.payment_method || '—')}</span>
        </div>
      </div>
    `;
  }

  async function loadOrders(){
    const { data, error } = await supabase
      .from('orders')
      .select('*, customers(name, contact, email), order_items(*)')
      .order('created_at', { ascending: false });
    if (error){
      adminToast('Erreur de chargement : ' + error.message, 'error');
      return;
    }
    ordersCache = data;
    renderOrders();
  }

  function renderOrders(){
    const list = activeFilter === 'toutes' ? ordersCache : ordersCache.filter(o => o.status === activeFilter);
    document.getElementById('orderCountLabel').textContent = list.length + ' commande(s).';
    document.getElementById('orderList').innerHTML = list.map(orderCardHTML).join('') || '<p style="color:var(--ink-faint);">Aucune commande dans ce filtre.</p>';
  }

  document.getElementById('filterTabs').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-filter]');
    if (!btn) return;
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('#filterTabs button').forEach(b => b.classList.toggle('active', b === btn));
    renderOrders();
  });

  document.getElementById('orderList').addEventListener('change', async (e) => {
    const select = e.target.closest('select[data-field]');
    if (!select) return;
    const card = select.closest('.order-card');
    const id = card.dataset.id;
    const field = select.dataset.field;
    const value = select.value;

    const { error } = await supabase.from('orders').update({ [field]: value }).eq('id', id);
    if (error){
      adminToast('Erreur de mise à jour : ' + error.message, 'error');
      return;
    }
    adminToast('Commande mise à jour.');
    const order = ordersCache.find(o => o.id === id);
    if (order) order[field] = value;
    if (field === 'status') renderOrders(); // peut faire disparaître la carte du filtre actif
  });

  (async () => {
    const user = await requireAdminSession();
    if (!user) return;
    document.getElementById('whoBox').textContent = user.email;
    document.getElementById('logoutBtn').addEventListener('click', logout);
    supabase = getSupabase();
    loadOrders();
  })();
</script>
</body>
</html>
