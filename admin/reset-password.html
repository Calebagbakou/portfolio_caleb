cd ~/portfolio_caleb
cat > admin/reset-password.html <<'EOF'
<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Caleb Creative</title>
<link rel="stylesheet" href="assets/admin.css">
</head>

<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <span class="login-brand-mark">CA</span>
      <span class="login-brand-text">
        Caleb Creative
        <span>Administration</span>
      </span>
    </div>

    <h1>Nouveau mot de passe</h1>
    <p>Entrez votre nouveau mot de passe.</p>

    <div class="form-error" id="formError"></div>
    <div id="successMessage"></div>

    <form id="resetForm">

      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
        Modifier le mot de passe
      </button>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>

<script>
document.addEventListener('DOMContentLoaded', async () => {

  const errorBox = document.getElementById('formError');
  const successMessage = document.getElementById('successMessage');
  const form = document.getElementById('resetForm');
  const resetBtn = document.getElementById('resetBtn');

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add('show');
  }

  try {

    if (typeof getSupabase !== 'function') {
      showError('Configuration Supabase introuvable.');
      return;
    }

    const supabase = getSupabase();

    if (!supabase) {
      showError('Impossible de charger Supabase.');
      return;
    }

    form.addEventListener('submit', async (event) => {

      event.preventDefault();

      errorBox.classList.remove('show');
      successMessage.textContent = '';

      const password =
        document.getElementById('password').value;

      const confirmPassword =
        document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        showError('Les deux mots de passe ne correspondent pas.');
        return;
      }

      resetBtn.disabled = true;
      resetBtn.textContent = 'Modification...';

      const { data: { session } } =
        await supabase.auth.getSession();

      if (!session) {
        showError(
          'Session de récupération absente ou expirée. Demandez un nouveau lien.'
        );

        resetBtn.disabled = false;
        resetBtn.textContent = 'Modifier le mot de passe';
        return;
      }

      const { error } =
        await supabase.auth.updateUser({
          password: password
        });

      if (error) {
        showError(error.message);

        resetBtn.disabled = false;
        resetBtn.textContent = 'Modifier le mot de passe';
        return;
      }

      successMessage.textContent =
        '✓ Mot de passe modifié avec succès.';

      resetBtn.textContent = 'Mot de passe enregistré';

      setTimeout(() => {
        window.location.href = 'login.html';
      }, 2000);

    });

  } catch (error) {

    showError(
      'Erreur de configuration : ' + error.message
    );

  }

});
</script>

</body>
</html>
EOF
