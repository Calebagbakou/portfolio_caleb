<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Caleb Creative</title>
<link rel="stylesheet" href="assets/admin.css">
</head>

<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <span class="login-brand-mark">CA</span>
      <span class="login-brand-text">
        Caleb Creative
        <span>Administration</span>
      </span>
    </div>

    <h1>Nouveau mot de passe</h1>
    <p>Choisissez votre nouveau mot de passe administrateur.</p>

    <div class="form-error" id="formError"></div>
    <div id="successMessage"></div>

    <form id="resetForm">

      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input
          type="password"
          id="password"
          required
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input
          type="password"
          id="confirmPassword"
          required
          minlength="6"
          autocomplete="new-password"
        >
      </div>

      <button
        type="submit"
        class="btn btn-primary btn-full"
        id="resetBtn"
      >
        Enregistrer le nouveau mot de passe
      </button>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>

<script>
const supabase = getSupabase();

const form = document.getElementById('resetForm');
const errorBox = document.getElementById('formError');
const successMessage = document.getElementById('successMessage');
const resetBtn = document.getElementById('resetBtn');

supabase.auth.onAuthStateChange(async (event, session) => {

  if (event === 'PASSWORD_RECOVERY') {
    console.log('Session de récupération détectée.');
  }

});

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  errorBox.classList.remove('show');
  successMessage.textContent = '';

  const password = document.getElementById('password').value;
  const confirmPassword =
    document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    errorBox.textContent =
      'Les deux mots de passe ne correspondent pas.';
    errorBox.classList.add('show');
    return;
  }

  resetBtn.disabled = true;
  resetBtn.textContent = 'Modification...';

  const { error } = await supabase.auth.updateUser({
    password: password
  });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.classList.add('show');

    resetBtn.disabled = false;
    resetBtn.textContent = 'Enregistrer le nouveau mot de passe';
    return;
  }

  successMessage.textContent =
    'Mot de passe modifié avec succès.';

  resetBtn.textContent = 'Mot de passe enregistré';

  setTimeout(() => {
    window.location.href = 'login.html';
  }, 1500);
});
</script>

</body>
</html>
