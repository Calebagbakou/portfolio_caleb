<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nouveau mot de passe — Caleb Creative</title>
<link rel="stylesheet" href="assets/admin.css">
</head>

<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <span class="login-brand-mark">CA</span>
      <span class="login-brand-text">
        Caleb Creative
        <span>Administration</span>
      </span>
    </div>

    <h1>Nouveau mot de passe</h1>
    <p>Entrez votre nouveau mot de passe.</p>

    <div class="form-error" id="formError"></div>
    <div id="successMessage"></div>

    <form id="resetForm">

      <div class="form-group">
        <label for="password">Nouveau mot de passe</label>
        <input type="password" id="password" minlength="6" required>
      </div>

      <div class="form-group">
        <label for="confirmPassword">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" minlength="6" required>
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
        Modifier le mot de passe
      </button>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>

<script>
const supabase = getSupabase();

const form = document.getElementById('resetForm');
const errorBox = document.getElementById('formError');
const successMessage = document.getElementById('successMessage');
const resetBtn = document.getElementById('resetBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  errorBox.classList.remove('show');
  successMessage.textContent = '';

  const password = document.getElementById('password').value;
  const confirmPassword =
    document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    errorBox.textContent =
      'Les deux mots de passe ne correspondent pas.';
    errorBox.classList.add('show');
    return;
  }

  if (password.length < 6) {
    errorBox.textContent =
      'Le mot de passe doit contenir au moins 6 caractères.';
    errorBox.classList.add('show');
    return;
  }

  resetBtn.disabled = true;
  resetBtn.textContent = 'Modification...';

  try {

    const { data: { session } } =
      await supabase.auth.getSession();

    if (!session) {
      throw new Error(
        'La session de récupération a expiré. Demandez un nouveau lien.'
      );
    }

    const { error } =
      await supabase.auth.updateUser({
        password: password
      });

    if (error) {
      throw error;
    }

    successMessage.textContent =
      '✓ Mot de passe modifié avec succès.';

    resetBtn.textContent = 'Mot de passe enregistré';

    setTimeout(() => {
      window.location.href = 'login.html';
    }, 2000);

  } catch (error) {

    errorBox.textContent =
      'Erreur : ' + error.message;

    errorBox.classList.add('show');

    resetBtn.disabled = false;
    resetBtn.textContent = 'Modifier le mot de passe';
  }
});
</script>

</body>
</html>
