<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Réinitialiser le mot de passe — Caleb Creative</title>
  <link rel="stylesheet" href="assets/admin.css">
</head>

<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <span class="login-brand-mark">CA</span>
      <span>Caleb Creative</span>
    </div>

    <h1>Nouveau mot de passe</h1>

    <p>Choisissez votre nouveau mot de passe administrateur.</p>

    <form id="resetForm">

      <label for="password">Nouveau mot de passe</label>
      <input
        type="password"
        id="password"
        required
        minlength="6"
        autocomplete="new-password"
      >

      <label for="confirmPassword">Confirmer le mot de passe</label>
      <input
        type="password"
        id="confirmPassword"
        required
        minlength="6"
        autocomplete="new-password"
      >

      <button type="submit">Enregistrer le nouveau mot de passe</button>

      <div id="message"></div>

    </form>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="../assets/config.js"></script>

<script>
const supabase = getSupabase();

const form = document.getElementById('resetForm');
const message = document.getElementById('message');

form.addEventListener('submit', async (event) => {
  event.preventDefault();

  const password = document.getElementById('password').value;
  const confirmPassword = document.getElementById('confirmPassword').value;

  if (password !== confirmPassword) {
    message.textContent = "Les deux mots de passe ne correspondent pas.";
    return;
  }

  const { error } = await supabase.auth.updateUser({
    password: password
  });

  if (error) {
    message.textContent = "Erreur : " + error.message;
    return;
  }

  message.textContent = "Mot de passe modifié avec succès.";

  setTimeout(() => {
    window.location.href = "login.html";
  }, 1500);
});
</script>

</body>
</html>
