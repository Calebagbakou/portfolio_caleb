<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produits — Admin Caleb Creative</title>
<link rel="stylesheet" href="assets/admin.css">
<style>
  .product-row{ border-bottom:1px solid var(--border); padding:16px 0; }
  .product-row-head{ display:flex; align-items:center; gap:14px; cursor:pointer; }
  .product-row-thumb{ width:52px;height:52px; border-radius:10px; flex-shrink:0; background:#000; }
  .product-row-info{ flex:1; min-width:0; }
  .product-row-title{ font-weight:600; font-size:14px; }
  .product-row-meta{ font-size:12px; color:var(--ink-faint); margin-top:2px; }
  .status-pill{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; }
  .status-pill.active{ background:rgba(74,222,128,0.15); color:var(--success); }
  .status-pill.draft{ background:rgba(255,255,255,0.08); color:var(--ink-faint); }
  .status-pill.archived{ background:rgba(255,92,92,0.12); color:var(--danger); }
  .product-row-actions{ display:flex; gap:6px; flex-shrink:0; }
  .product-row-actions button{ font-size:12px; padding:7px 12px; border-radius:7px; border:1px solid var(--border-strong); background:transparent; color:var(--ink-dim); cursor:pointer; }
  .product-row-actions button:hover{ background:var(--surface-alt); color:var(--ink); }
  .plans-panel{ display:none; margin-top:14px; padding:14px; background:var(--surface-alt); border-radius:var(--radius-sm); }
  .plans-panel.open{ display:block; }
  .plan-line{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border); font-size:13px; }
  .plan-line:last-child{ border-bottom:none; }
  .plan-line .lbl{ flex:1; font-weight:600; }
  .plan-line .prc{ color:var(--ink-dim); }
  .plan-line button{ font-size:11.5px; padding:5px 9px; border-radius:6px; border:1px solid var(--border-strong); background:transparent; color:var(--ink-dim); cursor:pointer; }
  .plan-form{ display:grid; grid-template-columns:1.4fr 1fr 1fr 0.8fr auto; gap:8px; margin-top:12px; align-items:end; }
  .plan-form label{ font-size:11px; color:var(--ink-faint); display:block; margin-bottom:4px; }
  .plan-form input{ width:100%; padding:9px 10px; border-radius:7px; border:1px solid var(--border-strong); background:var(--surface); color:var(--ink); font-size:13px; }
  @media(max-width:700px){ .plan-form{ grid-template-columns:1fr 1fr; } }
  .checkbox-row{ display:flex; align-items:center; gap:8px; margin-bottom:16px; }
  .checkbox-row input{ width:16px; height:16px; }
</style>
</head>
<body>

<div class="admin-shell">
  <div class="admin-mobile-bar">
    <button class="admin-menu-btn" data-admin-menu-open aria-label="Ouvrir le menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <span class="brand"><span class="brand-mark">CA</span>Admin</span>
  </div>
  <div class="admin-sidebar-backdrop"></div>
  <aside class="admin-sidebar">
    <div class="admin-brand">
      <span class="admin-brand-mark">CA</span>
      <span class="admin-brand-text">Admin</span>
    </div>

    <nav class="admin-nav">
      <a href="index.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        Dashboard
      </a>

      <div class="admin-nav-label">Portfolio</div>
      <a href="projects.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="14" rx="2"/><path d="M3 13l5-4 4 3 5-5 4 3"/></svg>Projets</a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M9 12l2 2 4-4"/></svg>Services<span class="soon">bientôt</span></a>

      <div class="admin-nav-label">Médias</div>
      <a href="media.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Bibliothèque média
      </a>

      <div class="admin-nav-label">Boutique</div>
      <a href="products.html" class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 3h2l2.4 12.4a2 2 0 002 1.6h8.2a2 2 0 002-1.6L21 8H6"/><circle cx="9" cy="20" r="1.4"/><circle cx="17" cy="20" r="1.4"/></svg>
        Produits
      </a>
      <a href="orders.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/></svg>Commandes</a>

      <div class="admin-nav-label">Général</div>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20l1.3-4A8 8 0 1112 20a8 8 0 01-4-1z"/></svg>Messages<span class="soon">bientôt</span></a>
      <a href="#"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z"/></svg>Paramètres<span class="soon">bientôt</span></a>
    </nav>

    <button class="admin-logout" id="logoutBtn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
      Déconnexion
    </button>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Produits</h1>
      <span class="who" id="whoBox"></span>
    </div>

    <div class="panel">
      <h2 id="formTitle">Nouveau produit</h2>
      <form id="productForm" style="margin-top:16px;">
        <input type="hidden" id="productId">

        <div class="form-group">
          <label for="name">Nom</label>
          <input type="text" id="name" required>
        </div>

        <div class="form-row-2" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div class="form-group">
            <label for="categoryInput">Catégorie</label>
            <input type="text" id="categoryInput" placeholder="Ex : Intelligence artificielle" list="categoryOptions">
            <datalist id="categoryOptions"></datalist>
            <div class="field-hint">Existante ou nouvelle — créée automatiquement si elle n'existe pas.</div>
          </div>
          <div class="form-group">
            <label for="coverMedia">Image (bibliothèque média)</label>
            <select id="coverMedia">
              <option value="">Aucune (dégradé automatique)</option>
            </select>
          </div>
        </div>

        <div class="form-group">
          <label for="tagline">Accroche courte</label>
          <input type="text" id="tagline" placeholder="Ex : L'assistant IA avancé de Google.">
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" rows="3"></textarea>
        </div>

        <div class="form-group">
          <label for="highlights">Points forts (un par ligne)</label>
          <textarea id="highlights" rows="3" placeholder="Accès illimité&#10;Activation rapide&#10;..."></textarea>
        </div>

        <div class="form-group">
          <label for="badge">Badge (optionnel)</label>
          <input type="text" id="badge" placeholder="Ex : Populaire, À vie...">
        </div>

        <div class="form-row-2" style="display:grid; grid-template-columns:1fr 1fr; gap:14px;">
          <div class="form-group">
            <label for="status">Statut</label>
            <select id="status">
              <option value="draft">Brouillon</option>
              <option value="active">Actif (visible en boutique)</option>
              <option value="archived">Archivé</option>
            </select>
          </div>
          <div class="form-group">
            <label for="sortOrder">Ordre d'affichage</label>
            <input type="number" id="sortOrder" value="0" step="1">
          </div>
        </div>

        <div class="checkbox-row">
          <input type="checkbox" id="featured">
          <label for="featured" style="margin:0;">Produit vedette</label>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn-primary" id="saveBtn">Enregistrer</button>
          <button type="button" class="btn btn-outline" id="cancelEditBtn" style="display:none;">Annuler la modification</button>
        </div>
      </form>
    </div>

    <div class="panel">
      <h2>Tous les produits</h2>
      <p id="productCountLabel">Chargement…</p>
      <div id="productList"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js"></script>
<script src="assets/ui.js"></script>
<script>
  let supabase;
  let productsCache = [];
  let categoriesCache = [];
  let mediaCache = [];

  function slugify(text){
    return text.toLowerCase().trim()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
  }

  function formatMoney(v){
    if (!v && v !== 0) return '—';
    return Number(v).toLocaleString('fr-FR') + ' FCFA';
  }

  async function loadLookups(){
    const [{ data: cats }, { data: media }] = await Promise.all([
      supabase.from('categories').select('*').eq('scope', 'boutique').order('sort_order'),
      supabase.from('media').select('id, name, type').order('created_at', { ascending: false }),
    ]);
    categoriesCache = cats || [];
    mediaCache = media || [];

    document.getElementById('categoryOptions').innerHTML = categoriesCache.map(c => `<option value="${c.label}">`).join('');

    const coverSelect = document.getElementById('coverMedia');
    coverSelect.innerHTML = '<option value="">Aucune (dégradé automatique)</option>' +
      mediaCache.filter(m => m.type === 'image').map(m => `<option value="${m.id}">${m.name || '(sans nom)'}</option>`).join('');
  }

  /** Trouve la catégorie par label, ou la crée si elle n'existe pas encore. */
  async function resolveCategoryId(label){
    if (!label || !label.trim()) return null;
    const trimmed = label.trim();
    const existing = categoriesCache.find(c => c.label.toLowerCase() === trimmed.toLowerCase());
    if (existing) return existing.id;

    const { data, error } = await supabase.from('categories').insert({
      scope: 'boutique', slug: slugify(trimmed), label: trimmed, sort_order: categoriesCache.length,
    }).select().single();
    if (error) throw error;
    categoriesCache.push(data);
    return data.id;
  }

  function resetForm(){
    document.getElementById('productForm').reset();
    document.getElementById('productId').value = '';
    document.getElementById('sortOrder').value = 0;
    document.getElementById('formTitle').textContent = 'Nouveau produit';
    document.getElementById('saveBtn').textContent = 'Enregistrer';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }
  document.getElementById('cancelEditBtn').addEventListener('click', resetForm);

  function productRowHTML(p){
    const catLabel = p.categories ? p.categories.label : '—';
    return `
      <div class="product-row" data-id="${p.id}">
        <div class="product-row-head" data-action="toggle-plans">
          <div class="product-row-thumb"></div>
          <div class="product-row-info">
            <div class="product-row-title">${escapeAdminHtml(p.name)}</div>
            <div class="product-row-meta">
              <span class="status-pill ${p.status}">${p.status === 'active' ? 'Actif' : p.status === 'archived' ? 'Archivé' : 'Brouillon'}</span>
              · ${escapeAdminHtml(catLabel)} · ordre ${p.sort_order}${p.featured ? ' · vedette' : ''} · ${(p.product_plans||[]).length} formule(s)
            </div>
          </div>
          <div class="product-row-actions">
            <button type="button" data-action="edit">Modifier</button>
            <button type="button" data-action="delete">Supprimer</button>
          </div>
        </div>
        <div class="plans-panel" id="plans-${p.id}">
          <div id="plansList-${p.id}"></div>
          <form class="plan-form" data-action="add-plan" data-product="${p.id}">
            <div><label>Nom de la formule</label><input type="text" placeholder="Ex : 12 mois" data-f="label" required></div>
            <div><label>Prix (FCFA)</label><input type="number" step="1" min="0" data-f="price" required></div>
            <div><label>Ancien prix</label><input type="number" step="1" min="0" data-f="old_price"></div>
            <div><label>Ordre</label><input type="number" step="1" value="0" data-f="sort_order"></div>
            <button type="submit" class="btn btn-outline" style="padding:9px 14px; font-size:12.5px;">Ajouter</button>
          </form>
        </div>
      </div>
    `;
  }

  function escapeAdminHtml(v){
    if (v === null || v === undefined) return '';
    return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function planLineHTML(pl){
    return `
      <div class="plan-line" data-plan-id="${pl.id}">
        <span class="lbl">${escapeAdminHtml(pl.label)}${pl.active === false ? ' (inactive)' : ''}</span>
        <span class="prc">${formatMoney(pl.price)}${pl.old_price ? ` <s style="opacity:.5;">${formatMoney(pl.old_price)}</s>` : ''}</span>
        <button type="button" data-action="delete-plan">Supprimer</button>
      </div>
    `;
  }

  async function loadProducts(){
    const { data, error } = await supabase
      .from('products')
      .select('*, product_plans(*), categories(id, label)')
      .order('sort_order', { ascending: true });
    if (error){
      adminToast('Erreur de chargement : ' + error.message, 'error');
      return;
    }
    productsCache = data;
    document.getElementById('productCountLabel').textContent = data.length + ' produit(s).';
    document.getElementById('productList').innerHTML = data.map(productRowHTML).join('') || '<p style="color:var(--ink-faint);">Aucun produit pour le moment.</p>';

    data.forEach(p => {
      const list = document.getElementById(`plansList-${p.id}`);
      const plans = (p.product_plans || []).slice().sort((a,b) => (a.sort_order||0)-(b.sort_order||0));
      list.innerHTML = plans.length ? plans.map(planLineHTML).join('') : '<p style="color:var(--ink-faint); font-size:12.5px;">Aucune formule — ajoute-en une ci-dessous.</p>';
    });
  }

  document.getElementById('productList').addEventListener('click', async (e) => {
    const toggleHead = e.target.closest('[data-action="toggle-plans"]');
    if (toggleHead && !e.target.closest('button')){
      const id = toggleHead.closest('.product-row').dataset.id;
      document.getElementById(`plans-${id}`).classList.toggle('open');
      return;
    }

    const btn = e.target.closest('button[data-action]');
    if (!btn) return;
    const row = btn.closest('.product-row');
    const id = row.dataset.id;
    const product = productsCache.find(p => p.id === id);

    if (btn.dataset.action === 'edit'){
      document.getElementById('productId').value = product.id;
      document.getElementById('name').value = product.name || '';
      document.getElementById('categoryInput').value = product.categories ? product.categories.label : '';
      document.getElementById('coverMedia').value = product.cover_media_id || '';
      document.getElementById('tagline').value = product.tagline || '';
      document.getElementById('description').value = product.description || '';
      document.getElementById('highlights').value = (product.highlights || []).join('\n');
      document.getElementById('badge').value = product.badge || '';
      document.getElementById('status').value = product.status || 'draft';
      document.getElementById('sortOrder').value = product.sort_order || 0;
      document.getElementById('featured').checked = !!product.featured;
      document.getElementById('formTitle').textContent = 'Modifier le produit';
      document.getElementById('saveBtn').textContent = 'Mettre à jour';
      document.getElementById('cancelEditBtn').style.display = 'inline-flex';
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    if (btn.dataset.action === 'delete'){
      const ok = await adminConfirm(`Supprimer définitivement « ${product.name} » et toutes ses formules ?`);
      if (!ok) return;
      setBtnLoading(btn, true, '...');
      const { error } = await supabase.from('products').delete().eq('id', id);
      setBtnLoading(btn, false);
      if (error){ adminToast('Erreur : ' + error.message, 'error'); return; }
      adminToast('Produit supprimé.');
      loadProducts();
    }

    if (btn.dataset.action === 'delete-plan'){
      const planId = btn.closest('.plan-line').dataset.planId;
      const ok = await adminConfirm('Supprimer cette formule ?');
      if (!ok) return;
      const { error } = await supabase.from('product_plans').delete().eq('id', planId);
      if (error){ adminToast('Erreur : ' + error.message, 'error'); return; }
      adminToast('Formule supprimée.');
      loadProducts();
    }
  });

  document.getElementById('productList').addEventListener('submit', async (e) => {
    const form = e.target.closest('[data-action="add-plan"]');
    if (!form) return;
    e.preventDefault();
    const productId = form.dataset.product;
    const btn = form.querySelector('button[type="submit"]');
    setBtnLoading(btn, true, '...');

    const payload = {
      product_id: productId,
      label: form.querySelector('[data-f="label"]').value.trim(),
      price: parseFloat(form.querySelector('[data-f="price"]').value) || 0,
      old_price: form.querySelector('[data-f="old_price"]').value ? parseFloat(form.querySelector('[data-f="old_price"]').value) : null,
      sort_order: parseInt(form.querySelector('[data-f="sort_order"]').value, 10) || 0,
      currency: 'FCFA',
    };

    const { error } = await supabase.from('product_plans').insert(payload);
    setBtnLoading(btn, false);
    if (error){ adminToast('Erreur : ' + error.message, 'error'); return; }
    adminToast('Formule ajoutée.');
    form.reset();
    loadProducts();
  });

  document.getElementById('productForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('saveBtn');
    setBtnLoading(btn, true, 'Enregistrement...');

    try {
      const id = document.getElementById('productId').value;
      const name = document.getElementById('name').value.trim();
      const categoryLabel = document.getElementById('categoryInput').value.trim();
      const categoryId = await resolveCategoryId(categoryLabel);

      const highlights = document.getElementById('highlights').value
        .split('\n').map(l => l.trim()).filter(Boolean);

      const payload = {
        name,
        slug: slugify(name) + (id ? '' : '-' + Date.now().toString(36)),
        category_id: categoryId,
        cover_media_id: document.getElementById('coverMedia').value || null,
        tagline: document.getElementById('tagline').value.trim() || null,
        description: document.getElementById('description').value.trim() || null,
        highlights,
        badge: document.getElementById('badge').value.trim() || null,
        status: document.getElementById('status').value,
        sort_order: parseInt(document.getElementById('sortOrder').value, 10) || 0,
        featured: document.getElementById('featured').checked,
        updated_at: new Date().toISOString(),
      };

      let error;
      if (id){
        delete payload.slug;
        ({ error } = await supabase.from('products').update(payload).eq('id', id));
      } else {
        ({ error } = await supabase.from('products').insert(payload));
      }
      if (error) throw error;

      adminToast(id ? 'Produit mis à jour.' : 'Produit créé — ajoute au moins une formule ci-dessous pour qu\'il soit achetable.');
      resetForm();
      loadProducts();

    } catch (err){
      adminToast(err.message || 'Une erreur est survenue.', 'error');
    } finally {
      setBtnLoading(btn, false);
    }
  });

  (async () => {
    const user = await requireAdminSession();
    if (!user) return;
    document.getElementById('whoBox').textContent = user.email;
    document.getElementById('logoutBtn').addEventListener('click', logout);
    supabase = getSupabase();
    await loadLookups();
    await loadProducts();
  })();
</script>
</body>
</html>
