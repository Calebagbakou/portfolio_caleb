<!DOCTYPE html>
<html lang="fr" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Administration — Caleb Creative</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/admin/assets/admin.css">
</head>
<body>

<!-- ===================== ÉCRAN DE CONNEXION ===================== -->
<div class="login-screen" id="loginScreen" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <div class="login-brand"><span class="mark">CA</span> Caleb Creative</div>
    <h1>Administration</h1>
    <p class="muted">Connecte-toi pour gérer le portfolio et la boutique.</p>
    <label>E-mail
      <input type="email" name="email" id="loginEmail" required autocomplete="username" placeholder="admin@exemple.com">
    </label>
    <label>Mot de passe
      <input type="password" name="password" id="loginPassword" required autocomplete="current-password" placeholder="••••••••••">
    </label>
    <div class="login-error" id="loginError" hidden></div>
    <button class="btn btn-primary" type="submit" id="loginBtn">Se connecter</button>
    <p class="login-note">Accès réservé. Les tentatives sont limitées.</p>
  </form>
</div>

<!-- ========================= APPLICATION ========================= -->
<div class="app" id="app" hidden>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <span class="mark">CA</span>
      <div><strong>Caleb Creative</strong><small>Administration</small></div>
      <button class="icon-btn sidebar-close" id="sidebarClose" aria-label="Fermer le menu">✕</button>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div class="who"><span class="avatar" id="userAvatar">?</span><span id="userName">—</span></div>
      <button class="btn btn-ghost btn-sm" id="logoutBtn">Déconnexion</button>
    </div>
  </aside>
  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn" aria-label="Menu">☰</button>
      <div class="topbar-title" id="pageTitle">Tableau de bord</div>
      <div class="topbar-actions">
        <a class="icon-btn" href="/" target="_blank" rel="noopener" title="Voir le site">↗</a>
      </div>
    </header>
    <main class="content" id="view"></main>
  </div>
</div>

<div class="toasts" id="toasts"></div>
<div class="modal-root" id="modalRoot"></div>

<script src="/admin/assets/api.js"></script>
<script src="/admin/assets/ui.js"></script>
<script src="/admin/assets/views.js"></script>
<script src="/admin/assets/app.js"></script>
</body>
</html>
