<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mot de passe oublié — Caleb Creative</title>
<link rel="stylesheet" href="assets/admin.css">
</head>
<body>

<div class="login-wrap">
  <div class="login-card">

    <div class="login-brand">
      <span class="login-brand-mark">CA</span>
      <span class="login-brand-text">Caleb Creative<span>Administration</span></span>
    </div>

    <h1>Mot de passe oublié</h1>
    <p>Entrez votre adresse e-mail pour recevoir le lien de réinitialisation.</p>

    <div class="form-error" id="formError"></div>
    <div id="successMessage"></div>

    <form id="forgotForm">

      <div class="form-group">
        <label for="email">Email administrateur</label>
        <input type="email" id="email" required autocomplete="email">
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="resetBtn">
        Envoyer le lien
      </button>

    </form>

    <p>
      <a href="login.html">← Retour à la connexion</a>
    </p>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="assets/config.js"></script>
<script src="assets/auth.js"></script>

<script>
const supabase = getSupabase();

const form = document.getElementById('forgotForm');
const errorBox = document.getElementById('formError');
const successMessage = document.getElementById('successMessage');
const resetBtn = document.getElementById('resetBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  errorBox.classList.remove('show');
  successMessage.textContent = '';

  const email = document.getElementById('email').value.trim();

  resetBtn.disabled = true;
  resetBtn.textContent = 'Envoi...';

  const { error } = await supabase.auth.resetPasswordForEmail(email, {
    redirectTo: 'https://calebagbakou.github.io/portfolio_caleb/admin/reset-password.html'
  });

  if (error) {
    errorBox.textContent = error.message;
    errorBox.classList.add('show');
    resetBtn.disabled = false;
    resetBtn.textContent = 'Envoyer le lien';
    return;
  }

  successMessage.textContent =
    'Un lien de réinitialisation a été envoyé à votre adresse e-mail.';

  resetBtn.disabled = false;
  resetBtn.textContent = 'Lien envoyé';
});
</script>

</body>
</html>
